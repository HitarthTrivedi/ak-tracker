<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>AK Tracker — setup</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #111827; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  .wrap { padding: 32px; display: flex; flex-direction: column; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: #111827; color: #fff; display: grid; place-items: center; font-weight: 800; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: #6b7280; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #6b7280; }
  input { height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #d1d5db; background: #fff; color: #111827; font: inherit; }
  input:focus { outline: none; border-color: #9ca3af; }
  button { height: 46px; border: 0; border-radius: 10px; background: #111827; color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #b91c1c; min-height: 20px; font-size: 13px; }
</style>
</head>
<body>
  <form class="wrap" id="f">
    <div class="brand"><div class="logo">AK</div><div><h1>Connect to your team</h1><p>One-time setup. Ask Hitarth for this connection string.</p></div></div>
    <label>Database connection string<input name="dbUrl" type="password" placeholder="postgresql://postgres:...@db.xxxx.supabase.co:5432/postgres" required /></label>
    <button id="b">Connect</button>
    <div class="err" id="e"></div>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const b = document.getElementById('b'), e = document.getElementById('e');
    b.disabled = true; b.textContent = 'Connecting…'; e.textContent = '';
    const r = await window.akDesktop.saveSetup({ dbUrl: ev.target.dbUrl.value });
    if (r && r.error) { e.textContent = r.error; b.disabled = false; b.textContent = 'Connect'; }
  });
</script>
</body>
</html>
