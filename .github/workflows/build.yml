# Builds the desktop app for Windows, macOS and Linux.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.1.0 to also attach the installers to a GitHub Release.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
            files: dist/*.exe
          - os: macos-latest      # Apple Silicon (M1 and newer)
            cmd: npm run dist:mac -- --arm64
            files: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            cmd: npm run dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Bake in the shared database connection
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('desktop/config.json', JSON.stringify({dbUrl: process.env.DB_URL}))"
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds (no Apple/Windows certificates)
      - uses: actions/upload-artifact@v4
        with:
          name: ak-tracker-${{ matrix.os }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
